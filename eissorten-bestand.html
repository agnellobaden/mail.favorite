<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eissorten-Bestand - EisFavorite</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
    }
    .container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        padding: 25px;
    }
    .back-link {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
        display: inline-block;
        margin-bottom: 15px;
    }
    h1 { color: #667eea; margin-bottom: 6px; font-size: 1.5em; }
    .subtitle { color: #888; margin-bottom: 20px; font-size: 0.9em; }

    .alert-banner {
        background: #f8d7da;
        border: 2px solid #dc3545;
        border-radius: 12px;
        padding: 16px 18px;
        margin-bottom: 24px;
    }
    .alert-banner h2 {
        color: #721c24;
        font-size: 1.05em;
        margin-bottom: 8px;
    }
    .alert-group { margin-bottom: 10px; }
    .alert-group:last-child { margin-bottom: 0; }
    .alert-group h3 {
        color: #721c24;
        font-size: 0.85em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        opacity: 0.75;
        margin-bottom: 6px;
    }
    .alert-banner ul {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }
    .alert-banner li {
        background: #dc3545;
        color: white;
        padding: 5px 12px;
        border-radius: 20px;
        font-weight: 700;
        font-size: 0.9em;
    }
    .all-good-banner {
        background: #d4edda;
        border: 2px solid #28a745;
        border-radius: 12px;
        padding: 14px 18px;
        margin-bottom: 24px;
        color: #155724;
        font-weight: 700;
    }

    .categories {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }
    @media (max-width: 700px) {
        .categories { grid-template-columns: 1fr; }
    }
    .category-card {
        border: 2px solid #eee;
        border-radius: 14px;
        padding: 16px;
    }
    .category-card h3 {
        color: #667eea;
        font-size: 1.1em;
        margin-bottom: 4px;
    }
    .category-card .cat-sub {
        color: #999;
        font-size: 0.8em;
        margin-bottom: 12px;
    }
    .flavor-row {
        padding: 8px 10px;
        border-radius: 10px;
        margin-bottom: 6px;
    }
    .flavor-row.low {
        background: #fff0f0;
        border: 1px solid #f5c2c7;
    }
    .flavor-row-main {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-bottom: 6px;
    }
    .flavor-name {
        font-weight: 600;
        color: #333;
        font-size: 0.95em;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
    }
    .flavor-row-stocks {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
    }
    .stock-block {
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .stock-label {
        font-size: 0.68em;
        color: #999;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-right: 2px;
    }
    .stock-btn {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: none;
        background: #667eea;
        color: white;
        font-weight: 700;
        cursor: pointer;
        font-size: 0.95em;
        line-height: 1;
        flex-shrink: 0;
    }
    .stock-btn:hover { background: #5a6fd8; }
    .stock-btn.minus { background: #dc3545; }
    .stock-btn.minus:hover { background: #c82333; }
    .stock-count {
        min-width: 22px;
        text-align: center;
        font-weight: 800;
        font-size: 1.05em;
        color: #333;
    }
    .stock-count.low { color: #dc3545; }
    .stock-block.reserve .stock-count { color: #666; }
    .transfer-btn {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: none;
        background: #ffc107;
        color: #333;
        font-weight: 700;
        cursor: pointer;
        font-size: 0.95em;
        flex-shrink: 0;
    }
    .transfer-btn:hover { background: #e0a800; }
    .transfer-btn:disabled {
        background: #eee;
        color: #bbb;
        cursor: not-allowed;
    }
    .min-badge {
        font-size: 0.7em;
        color: #999;
        cursor: pointer;
        text-decoration: underline dotted;
        white-space: nowrap;
    }
    .delete-flavor-btn {
        background: none;
        border: none;
        color: #dc3545;
        cursor: pointer;
        font-size: 0.75em;
        opacity: 0.6;
        margin-left: auto;
    }
    .delete-flavor-btn:hover { opacity: 1; }
    .produce-toggle-btn {
        background: #f1f1f1;
        border: none;
        color: #888;
        cursor: pointer;
        font-size: 0.75em;
        padding: 3px 8px;
        border-radius: 10px;
        margin-left: auto;
        white-space: nowrap;
    }
    .produce-toggle-btn:hover { background: #e5e5e5; }
    .produce-toggle-btn.active {
        background: #dc3545;
        color: white;
        font-weight: 700;
    }
    .produce-toggle-btn.active:hover { background: #c82333; }
    .flavor-row-main .delete-flavor-btn { margin-left: 6px; }
    .add-flavor-btn {
        width: 100%;
        margin-top: 10px;
        padding: 10px;
        border: 2px dashed #667eea;
        background: none;
        color: #667eea;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
    }
    .add-flavor-btn:hover { background: #f0f2ff; }
</style>
</head>
<body>

    <div class="container">
        <a href="buchungen-uebersicht.html" class="back-link">← Zurück zur Übersicht</a>
        <h1>🍦 Eissorten-Bestand</h1>
        <p class="subtitle">"Verkauf" = was gerade im Auto ist, "Reserve" = was noch im Lager wartet. Mit ⬆️ holst du eine Wanne aus der Reserve ins Auto. Schokolade &amp; Vanille brauchen immer mindestens 2 im Verkauf.</p>

        <div id="alertArea"></div>

        <div class="categories" id="categoriesArea"></div>
    </div>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyDNtaUvAbjU2OHjLWNnNJyhkccoH9YlkYo",
            authDomain: "mailfavorite-e8f49.firebaseapp.com",
            projectId: "mailfavorite-e8f49",
            storageBucket: "mailfavorite-e8f49.firebasestorage.app",
            messagingSenderId: "73719715044",
            appId: "1:73719715044:web:e0e762cda49ae166b6c8f1",
            measurementId: "G-WGRT5L3NCX"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();

        // Gleiche Sorten & Emojis wie auf eisfavorite.de. Die 15 Milcheis-Sorten
        // sind der feste Auto-Verkaufsbestand - müssen immer verfügbar sein
        // (Mindestmenge 1), Schokolade & Vanille laufen am meisten und brauchen
        // deshalb 2. Fruchteis ist wechselndes Angebot ohne feste Mindestmenge.
        var FLAVORS = [
            { id: 'schokolade', name: 'Schokolade', emoji: '🍫', category: 'milch', minStock: 2, hasEgg: true },
            { id: 'vanille', name: 'Vanille', emoji: '🌼', category: 'milch', minStock: 2, hasEgg: true },
            { id: 'pistazie', name: 'Pistazie', emoji: '💚', category: 'milch', minStock: 1, hasEgg: true },
            { id: 'banane', name: 'Banane', emoji: '🍌', category: 'milch', minStock: 1, hasEgg: true },
            { id: 'stracciatella', name: 'Stracciatella', emoji: '🍨', category: 'milch', minStock: 1, hasEgg: true },
            { id: 'haselnuss', name: 'Haselnuss', emoji: '🌰', category: 'milch', minStock: 1, hasEgg: true },
            { id: 'kokos', name: 'Kokos', emoji: '🥥', category: 'milch', minStock: 1 },
            { id: 'cookie', name: 'Cookie', emoji: '🍪', category: 'milch', minStock: 1 },
            { id: 'joghurt', name: 'Joghurt', emoji: '🥛', category: 'milch', minStock: 1 },
            { id: 'trueffel', name: 'Trüffel', emoji: '🤎', category: 'milch', minStock: 1 },
            { id: 'weisse-schokolade', name: 'Weiße Schokolade', emoji: '🤍', category: 'milch', minStock: 1 },
            { id: 'malaga', name: 'Malaga', emoji: '🍷', category: 'milch', minStock: 1, hasEgg: true },
            { id: 'delfino', name: 'Delfino', emoji: '🐬', category: 'milch', minStock: 1 },
            { id: 'joghurt-kirsch', name: 'Joghurt-Kirsch', emoji: '🍒', category: 'milch', minStock: 1 },
            { id: 'waldmeister', name: 'Waldmeister', emoji: '🌱', category: 'milch', minStock: 1 },
            { id: 'erdbeere', name: 'Erdbeere', emoji: '🍓', category: 'frucht', minStock: 0 },
            { id: 'mango', name: 'Mango', emoji: '🥭', category: 'frucht', minStock: 0 },
            { id: 'zitrone', name: 'Zitrone', emoji: '🍋', category: 'frucht', minStock: 0 },
            { id: 'melone', name: 'Melone', emoji: '🍈', category: 'frucht', minStock: 0 },
            { id: 'himbeere', name: 'Himbeere', emoji: '💖', category: 'frucht', minStock: 0 },
            { id: 'aprikose', name: 'Aprikose', emoji: '🍑', category: 'frucht', minStock: 0 },
            { id: 'ananas', name: 'Ananas', emoji: '🍍', category: 'frucht', minStock: 0 },
            { id: 'johannisbeere', name: 'Johannisbeere', emoji: '💜', category: 'frucht', minStock: 0 },
            { id: 'exotic-cocktail', name: 'Exotic Cocktail', emoji: '🍹', category: 'frucht', minStock: 0 }
        ];

        var stockData = {}; // { flavorId: { currentStock (=Im Verkauf), reserveStock, minStock, name/emoji/category (nur bei custom) } }

        // Liefert die Definition (Name/Emoji/Kategorie/Standard-Mindestmenge) für
        // eine fest eingebaute ODER eine manuell hinzugefügte (custom) Sorte.
        function getFlavorDef(id) {
            var builtin = FLAVORS.find(function(f) { return f.id === id; });
            if (builtin) return builtin;
            var s = stockData[id];
            if (s && s.custom) {
                return { id: id, name: s.name, emoji: s.emoji || '🍦', category: s.category, minStock: 0 };
            }
            return null;
        }

        function getFlavorsForCategory(category) {
            var builtins = FLAVORS.filter(function(f) { return f.category === category; });
            var customIds = Object.keys(stockData).filter(function(id) {
                return stockData[id].custom && stockData[id].category === category;
            });
            var customs = customIds.map(getFlavorDef).filter(Boolean);
            return builtins.concat(customs);
        }

        function getAllFlavors() {
            return getFlavorsForCategory('milch').concat(getFlavorsForCategory('frucht'));
        }

        // Alle fest eingebauten Sorten (Milcheis + Fruchteis, ohne manuell
        // hinzugefügte) - das ist "das volle Sortiment", das komplett im
        // Verkauf sein soll.
        var BASE_ALL_FLAVORS = FLAVORS;

        function renderCompletenessBanner() {
            var missing = BASE_ALL_FLAVORS.filter(function(f) {
                var s = stockData[f.id] || {};
                return (s.currentStock || 0) <= 0;
            });
            var haveCount = BASE_ALL_FLAVORS.length - missing.length;

            if (missing.length === 0) {
                return '<div class="all-good-banner">✅ Vollständig: alle ' + BASE_ALL_FLAVORS.length + ' von ' + BASE_ALL_FLAVORS.length + ' Sorten im Verkauf.</div>';
            }
            var missingMilch = missing.filter(function(f) { return f.category === 'milch'; });
            var missingFrucht = missing.filter(function(f) { return f.category === 'frucht'; });
            var renderMissingGroup = function(title, flavors) {
                if (flavors.length === 0) return '';
                return '<div class="alert-group">' +
                    '<h3>' + title + '</h3>' +
                    '<ul>' + flavors.map(function(f) {
                        return '<li>' + f.emoji + ' ' + f.name + '</li>';
                    }).join('') + '</ul>' +
                '</div>';
            };
            return '<div class="alert-banner">' +
                '<h2>⚠️ Nur ' + haveCount + ' von ' + BASE_ALL_FLAVORS.length + ' Sorten im Verkauf - es fehlen:</h2>' +
                renderMissingGroup('Milcheis', missingMilch) +
                renderMissingGroup('Fruchteis', missingFrucht) +
            '</div>';
        }

        function render() {
            // Alarm-Banner "Jetzt nachproduzieren": Reserve zählt als Bestand mit -
            // ist noch genug in Reserve, muss NICHT neu produziert werden, nur mit
            // ⬆️ ins Auto nachgefüllt. Nur wenn Verkauf+Reserve zusammen nicht
            // reichen, ist es ein echter Produktions-Engpass.
            var lowFlavors = getAllFlavors().filter(function(f) {
                var s = stockData[f.id] || {};
                if (s.manualProduce) return true; // manuell markiert, egal wie viel Bestand da ist
                var current = s.currentStock || 0;
                var reserve = s.reserveStock || 0;
                var total = current + reserve;
                var min = (s.minStock !== undefined ? s.minStock : f.minStock);
                return total < min || total === 0;
            });

            var alertArea = document.getElementById('alertArea');
            var html = renderCompletenessBanner();

            if (lowFlavors.length > 0) {
                // Für die Produktion nach Ei / ohne Ei sortiert (unterschiedliche Basis).
                var lowMitEi = lowFlavors.filter(function(f) { return f.hasEgg; });
                var lowOhneEi = lowFlavors.filter(function(f) { return !f.hasEgg; });

                var renderAlertGroup = function(title, flavors) {
                    if (flavors.length === 0) return '';
                    return '<div class="alert-group">' +
                        '<h3>' + title + '</h3>' +
                        '<ul>' + flavors.map(function(f) {
                            return '<li>' + f.emoji + ' ' + f.name + '</li>';
                        }).join('') + '</ul>' +
                    '</div>';
                };

                html += '<div class="alert-banner">' +
                    '<h2>🚨 Jetzt nachproduzieren:</h2>' +
                    renderAlertGroup('🥚 Mit Ei', lowMitEi) +
                    renderAlertGroup('🚫🥚 Ohne Ei', lowOhneEi) +
                '</div>';
            } else {
                html += '<div class="all-good-banner">✅ Alle Sorten ausreichend auf Lager.</div>';
            }

            alertArea.innerHTML = html;

            document.getElementById('categoriesArea').innerHTML =
                renderCategory('Milcheis Klassiker & Specials', '', 'milch') +
                renderCategory('Fruchteis', '(Vegan & Laktosefrei)', 'frucht');

            attachHandlers();
        }

        function renderCategory(title, sub, categoryKey) {
            var flavors = getFlavorsForCategory(categoryKey);
            var rows = flavors.map(function(f) {
                var s = stockData[f.id] || {};
                var current = s.currentStock || 0;
                var reserve = s.reserveStock || 0;
                var min = (s.minStock !== undefined ? s.minStock : f.minStock);
                var isLow = current < min || current === 0;
                var isCustom = !!(s.custom);
                var isManual = !!(s.manualProduce);
                return '<div class="flavor-row' + (isLow || isManual ? ' low' : '') + '">' +
                    '<div class="flavor-row-main">' +
                        '<div class="flavor-name">' + f.emoji + ' ' + f.name +
                            (min > 0 ? '<span class="min-badge" data-id="' + f.id + '" title="Mindestmenge ändern">min. ' + min + '</span>' : '') +
                        '</div>' +
                        '<button class="produce-toggle-btn' + (isManual ? ' active' : '') + '" data-id="' + f.id + '" title="Manuell auf die Nachproduzieren-Liste setzen, auch wenn genug Bestand da ist">🏭' + (isManual ? ' auf Liste' : '') + '</button>' +
                        (isCustom ? '<button class="delete-flavor-btn" data-id="' + f.id + '" title="Sorte entfernen">🗑️ entfernen</button>' : '') +
                    '</div>' +
                    '<div class="flavor-row-stocks">' +
                        '<div class="stock-block">' +
                            '<span class="stock-label">Verkauf</span>' +
                            '<button class="stock-btn minus" data-id="' + f.id + '" data-field="sales" data-delta="-1">−</button>' +
                            '<span class="stock-count' + (isLow ? ' low' : '') + '">' + current + '</span>' +
                            '<button class="stock-btn plus" data-id="' + f.id + '" data-field="sales" data-delta="1">+</button>' +
                        '</div>' +
                        '<button class="transfer-btn" data-id="' + f.id + '" title="1 aus Reserve ins Auto nachfüllen"' + (reserve <= 0 ? ' disabled' : '') + '>⬆️</button>' +
                        '<div class="stock-block reserve">' +
                            '<span class="stock-label">Reserve</span>' +
                            '<button class="stock-btn minus" data-id="' + f.id + '" data-field="reserve" data-delta="-1">−</button>' +
                            '<span class="stock-count">' + reserve + '</span>' +
                            '<button class="stock-btn plus" data-id="' + f.id + '" data-field="reserve" data-delta="1">+</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');

            return '<div class="category-card">' +
                '<h3>' + title + '</h3>' +
                (sub ? '<div class="cat-sub">' + sub + '</div>' : '<div class="cat-sub">&nbsp;</div>') +
                rows +
                '<button class="add-flavor-btn" data-category="' + categoryKey + '">+ Neue Sorte hinzufügen</button>' +
            '</div>';
        }

        function attachHandlers() {
            document.querySelectorAll('.stock-btn').forEach(function(btn) {
                btn.onclick = function() {
                    var id = btn.dataset.id;
                    var field = btn.dataset.field; // 'sales' oder 'reserve'
                    var delta = parseInt(btn.dataset.delta, 10);
                    var s = stockData[id] || {};
                    if (field === 'reserve') {
                        var nextReserve = Math.max(0, (s.reserveStock || 0) + delta);
                        setFields(id, { reserveStock: nextReserve });
                    } else {
                        var nextSales = Math.max(0, (s.currentStock || 0) + delta);
                        setFields(id, { currentStock: nextSales });
                    }
                };
            });
            document.querySelectorAll('.transfer-btn').forEach(function(btn) {
                btn.onclick = function() {
                    if (btn.disabled) return;
                    var id = btn.dataset.id;
                    var s = stockData[id] || {};
                    var reserve = s.reserveStock || 0;
                    if (reserve <= 0) return;
                    setFields(id, {
                        reserveStock: reserve - 1,
                        currentStock: (s.currentStock || 0) + 1
                    });
                };
            });
            document.querySelectorAll('.min-badge').forEach(function(el) {
                el.onclick = function() {
                    var id = el.dataset.id;
                    var flavor = getFlavorDef(id);
                    var currentMin = (stockData[id] && stockData[id].minStock !== undefined) ? stockData[id].minStock : flavor.minStock;
                    var input = prompt('Mindestmenge für ' + flavor.name + ':', currentMin);
                    if (input === null) return;
                    var val = parseInt(input, 10);
                    if (isNaN(val) || val < 0) return;
                    setFields(id, { minStock: val });
                };
            });
            document.querySelectorAll('.produce-toggle-btn').forEach(function(btn) {
                btn.onclick = function() {
                    var id = btn.dataset.id;
                    var isManual = !!(stockData[id] && stockData[id].manualProduce);
                    setFields(id, { manualProduce: !isManual });
                };
            });
            document.querySelectorAll('.delete-flavor-btn').forEach(function(el) {
                el.onclick = function() {
                    var id = el.dataset.id;
                    var flavor = getFlavorDef(id);
                    if (!confirm('„' + (flavor ? flavor.name : id) + '" wirklich entfernen?')) return;
                    db.collection('flavorStock').doc(id).delete().catch(function(err) {
                        console.error('❌ Sorte konnte nicht entfernt werden:', err);
                    });
                };
            });
            document.querySelectorAll('.add-flavor-btn').forEach(function(btn) {
                btn.onclick = function() {
                    addCustomFlavor(btn.dataset.category);
                };
            });
        }

        function addCustomFlavor(category) {
            var name = prompt('Name der neuen Sorte:');
            if (!name || !name.trim()) return;
            name = name.trim();
            var emoji = prompt('Emoji für "' + name + '" (optional, z.B. 🍦):', '🍦');
            if (emoji === null || !emoji.trim()) emoji = '🍦';
            var slug = name.toLowerCase()
                .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
                .replace(/[^a-z0-9]+/g, '-').replace(/(^-+|-+$)/g, '');
            var id = 'custom-' + (slug || 'sorte') + '-' + Date.now().toString(36);

            db.collection('flavorStock').doc(id).set({
                name: name,
                emoji: emoji.trim(),
                category: category,
                custom: true,
                currentStock: 0,
                reserveStock: 0,
                minStock: 0,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(function(err) {
                console.error('❌ Sorte konnte nicht hinzugefügt werden:', err);
                alert('❌ Fehler beim Hinzufügen der Sorte.');
            });
        }

        function setFields(id, fields) {
            fields.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
            db.collection('flavorStock').doc(id).set(fields, { merge: true }).catch(function(err) {
                console.error('❌ Bestand konnte nicht gespeichert werden:', err);
            });
        }

        db.collection('flavorStock').onSnapshot(function(snapshot) {
            stockData = {};
            snapshot.forEach(function(doc) {
                stockData[doc.id] = doc.data();
            });
            render();
        }, function(error) {
            console.error('❌ Bestand konnte nicht geladen werden:', error);
            document.getElementById('alertArea').innerHTML = '<div class="alert-banner"><h2>Fehler beim Laden: ' + error.message + '</h2></div>';
        });

        render();
    </script>
</body>
</html>
