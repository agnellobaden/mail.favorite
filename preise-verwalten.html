<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preise verwalten - EisFavorite</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
    }
    .container {
        max-width: 500px;
        margin: 0 auto;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        padding: 25px;
    }
    .back-link {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
        display: inline-block;
        margin-bottom: 15px;
    }
    h1 { color: #667eea; margin-bottom: 20px; font-size: 1.5em; }
    .price-row { margin-bottom: 16px; }
    .price-row label {
        display: block;
        font-weight: 600;
        font-size: 0.95em;
        color: #333;
        margin-bottom: 6px;
    }
    .price-row input {
        width: 100%;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 1em;
    }
    .price-row input:focus { outline: none; border-color: #667eea; }
    .actions {
        display: flex;
        gap: 10px;
        margin-top: 24px;
    }
    .btn {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-size: 1em;
        font-weight: 700;
        cursor: pointer;
    }
    .btn-save { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .status-msg { text-align: center; margin-top: 15px; color: #28a745; font-weight: 600; min-height: 1.2em; }
</style>
</head>
<body>
    <div class="container">
        <a href="buchungen-uebersicht.html" class="back-link">← Zurück zur Übersicht</a>
        <h1>💰 Produktpreise verwalten</h1>
        <div id="priceInputsContainer"></div>
        <div class="actions">
            <button class="btn btn-save" onclick="savePricesFromPage()">💾 Speichern</button>
        </div>
        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script>
        const PRODUCTS_LIST = [
            { id: 'kugel', name: 'Kugel Eis', emoji: '🍨' },
            { id: 'spaghetti', name: 'Spaghetti Eis', emoji: '🍝' },
            { id: 'schokobecher', name: 'Schoko Becher', emoji: '🍫' },
            { id: 'sahne', name: 'Sahne', emoji: '🥛' },
            { id: 'eiskaffee', name: 'Eiskaffee', emoji: '☕' },
            { id: 'milchshake', name: 'Milchshake', emoji: '🥤' },
            { id: 'streussel', name: 'Streussel', emoji: '🎨' },
            { id: 'toppings', name: 'Toppings', emoji: '🍓' }
        ];

        const DEFAULT_PRICES = {
            kugel: 1.80, spaghetti: 7.50, schokobecher: 7.50, sahne: 1.80,
            eiskaffee: 7.50, milchshake: 6.00, streussel: 0.50, toppings: 1.00
        };

        function loadPrices() {
            try {
                const saved = localStorage.getItem('productPrices');
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            return { ...DEFAULT_PRICES };
        }

        function render() {
            const prices = loadPrices();
            document.getElementById('priceInputsContainer').innerHTML = PRODUCTS_LIST.map(p => `
                <div class="price-row">
                    <label>${p.emoji} ${p.name} (€)</label>
                    <input type="number" step="0.01" min="0" id="priceInput_${p.id}" value="${(prices[p.id] ?? DEFAULT_PRICES[p.id]).toFixed(2)}">
                </div>
            `).join('');
        }

        function savePricesFromPage() {
            const prices = {};
            PRODUCTS_LIST.forEach(p => {
                const val = parseFloat(document.getElementById(`priceInput_${p.id}`).value);
                prices[p.id] = isNaN(val) ? DEFAULT_PRICES[p.id] : val;
            });
            localStorage.setItem('productPrices', JSON.stringify(prices));
            document.getElementById('statusMsg').textContent = '✅ Preise gespeichert!';
            setTimeout(() => { document.getElementById('statusMsg').textContent = ''; }, 2500);
        }

        render();
    </script>
</body>
</html>
