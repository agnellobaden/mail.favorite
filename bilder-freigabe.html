<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
    }
    .container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        padding: 25px;
    }
    .back-link {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
        display: inline-block;
        margin-bottom: 15px;
    }
    h1 { color: #667eea; margin-bottom: 20px; font-size: 1.5em; }
    .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }
    .tab {
        padding: 8px 16px;
        border-radius: 20px;
        border: 2px solid #667eea;
        background: white;
        color: #667eea;
        font-weight: 600;
        font-size: 0.9em;
        cursor: pointer;
    }
    .tab.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }
    .upload-card {
        border: 1px solid #eee;
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 18px;
    }
    .upload-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
    }
    .upload-title { font-size: 1.15em; font-weight: 700; color: #333; display: inline; }
    .edit-title-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 0.9em;
        margin-left: 6px;
        opacity: 0.6;
    }
    .edit-title-btn:hover { opacity: 1; }
    .upload-meta { font-size: 0.85em; color: #888; }
    .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 0.8em;
        font-weight: 700;
    }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-approved { background: #d4edda; color: #155724; }
    .status-rejected { background: #f8d7da; color: #721c24; }
    .photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 12px;
        margin-bottom: 14px;
    }
    .photo-item {
        position: relative;
    }
    .photo-grid img {
        width: 100%;
        height: 260px;
        object-fit: cover;
        border-radius: 10px;
        border: 1px solid #ddd;
        cursor: zoom-in;
        display: block;
    }
    .photo-delete-btn {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: none;
        background: rgba(220, 53, 69, 0.9);
        color: white;
        font-weight: 700;
        cursor: pointer;
        line-height: 1;
    }
    .photo-delete-btn:hover { background: #dc3545; }
    .photo-star-btn {
        position: absolute;
        top: 6px;
        left: 6px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: none;
        background: rgba(255,255,255,0.85);
        color: #ccc;
        font-size: 1em;
        cursor: pointer;
        line-height: 1;
    }
    .photo-star-btn:hover { background: #fff; color: #f5b301; }
    .photo-star-btn.featured {
        background: #ffc107;
        color: #fff;
    }
    .upload-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }
    .upload-actions button {
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.9em;
        cursor: pointer;
    }
    .btn-approve { background: #28a745; color: white; }
    .btn-reject { background: #ffc107; color: #333; }
    .btn-delete { background: #dc3545; color: white; }
    .btn-add-photo { background: #667eea; color: white; }
    .empty-msg { text-align: center; color: #888; padding: 40px 0; }
    .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.9);
        z-index: 1000000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 30px;
        cursor: zoom-out;
    }
    .lightbox.active { display: flex; }
    .lightbox img {
        max-width: 100%;
        max-height: 100%;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
</style>

    <div class="container">
        <a href="buchungen-uebersicht.html" class="back-link">← Zurück zur Übersicht</a>
        <h1>🖼️ Event-Bilder freigeben</h1>

        <div class="tabs">
            <button class="tab active" data-filter="pending" onclick="setFilter('pending')">⏳ Ausstehend</button>
            <button class="tab" data-filter="approved" onclick="setFilter('approved')">✅ Freigegeben</button>
            <button class="tab" data-filter="rejected" onclick="setFilter('rejected')">❌ Abgelehnt</button>
            <button class="tab" data-filter="all" onclick="setFilter('all')">📋 Alle</button>
        </div>

        <div id="uploadsList"></div>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="">
    </div>

    <script>
        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('active');
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }
    </script>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyDNtaUvAbjU2OHjLWNnNJyhkccoH9YlkYo",
            authDomain: "mailfavorite-e8f49.firebaseapp.com",
            projectId: "mailfavorite-e8f49",
            storageBucket: "mailfavorite-e8f49.firebasestorage.app",
            messagingSenderId: "73719715044",
            appId: "1:73719715044:web:e0e762cda49ae166b6c8f1",
            measurementId: "G-WGRT5L3NCX"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();
        // Multi-Tab-Synchronisation: bei mehreren offenen Tabs dieser Seite liest nur
        // einer wirklich vom Server, die anderen teilen sich den lokalen Cache - sonst
        // liest jeder offene Tab die (teils grossen) Fotodaten separat neu.
        db.enablePersistence({ synchronizeTabs: true }).catch(function(err) {
            console.warn('⚠️ Multi-Tab-Persistenz nicht verfuegbar:', err.code);
        });

        var allPhotoDocs = [];
        var currentFilter = 'pending';

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.tab').forEach(function(t) {
                t.classList.toggle('active', t.dataset.filter === filter);
            });
            render();
        }

        var STATUS_LABELS = {
            pending: ['⏳ Ausstehend', 'status-pending'],
            approved: ['✅ Freigegeben', 'status-approved'],
            rejected: ['❌ Abgelehnt', 'status-rejected']
        };

        // Jedes Firestore-Dokument ist genau 1 Foto (Firestore-1MB-Limit) -
        // für die Anzeige nach uploadGroupId zu Alben zusammenfassen.
        function groupUploads() {
            var groups = {};
            allPhotoDocs.forEach(function(doc) {
                var key = doc.uploadGroupId || doc.id;
                if (!groups[key]) {
                    groups[key] = { id: key, title: doc.title, status: doc.status, createdAt: doc.createdAt, socialLink: doc.socialLink || '', docIds: [], photos: [], videos: [] };
                }
                groups[key].docIds.push(doc.id);
                if (doc.videoUrl) {
                    groups[key].videos.push({ docId: doc.id, url: doc.videoUrl });
                } else {
                    groups[key].photos.push({ docId: doc.id, imageData: doc.imageData });
                }
                if (doc.socialLink) groups[key].socialLink = doc.socialLink;
                // Status: 'pending' überstimmt (falls einzelne Fotos noch nicht entschieden sind)
                if (doc.status === 'pending') groups[key].status = 'pending';
            });
            return Object.values(groups).sort(function(a, b) {
                var ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
                var tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
                return tb - ta;
            });
        }

        function render() {
            var list = document.getElementById('uploadsList');
            var groups = groupUploads().filter(function(g) {
                return currentFilter === 'all' || g.status === currentFilter;
            });

            if (groups.length === 0) {
                list.innerHTML = '<div class="empty-msg">Keine Einträge in dieser Ansicht.</div>';
                return;
            }

            list.innerHTML = groups.map(function(g) {
                var statusInfo = STATUS_LABELS[g.status] || ['?', ''];
                var dateStr = g.createdAt && g.createdAt.toDate ? g.createdAt.toDate().toLocaleString('de-DE') : '';
                var photosHtml = g.photos.map(function(photo) {
                    var isFeatured = photo.imageData === currentFeaturedImageData;
                    return '<div class="photo-item">' +
                        '<img src="' + photo.imageData + '" alt="" onclick="openLightbox(\'' + photo.imageData + '\')">' +
                        '<button class="photo-star-btn' + (isFeatured ? ' featured' : '') + '" title="Als Startseiten-Bild festlegen" onclick=\'setFeaturedPhoto("' + photo.docId + '")\'>★</button>' +
                        '<button class="photo-delete-btn" title="Nur dieses Foto löschen" onclick=\'deletePhoto("' + photo.docId + '")\'>✕</button>' +
                    '</div>';
                }).join('');
                var videosHtml = g.videos.map(function(video) {
                    return '<div class="photo-item">' +
                        '<video src="' + video.url + '" controls preload="metadata" style="width:100%;height:260px;object-fit:cover;border-radius:10px;border:1px solid #ddd;"></video>' +
                        '<button class="photo-delete-btn" title="Nur dieses Video löschen" onclick=\'deletePhoto("' + video.docId + '")\'>✕</button>' +
                    '</div>';
                }).join('');
                var groupIdsJson = JSON.stringify(g.docIds).replace(/'/g, '&#39;');
                var titleJson = JSON.stringify(g.title).replace(/'/g, '&#39;');
                var linkJson = JSON.stringify(g.socialLink || '').replace(/'/g, '&#39;');

                return '<div class="upload-card">' +
                    '<div class="upload-card-header">' +
                        '<div>' +
                            '<span class="upload-title">' + escapeHtml(g.title) + '</span>' +
                            '<button class="edit-title-btn" title="Titel bearbeiten" onclick=\'editTitle(' + groupIdsJson + ', ' + titleJson + ')\'>✏️</button>' +
                            '<button class="edit-title-btn" title="Instagram/Facebook/YouTube-Link setzen" onclick=\'editSocialLink(' + groupIdsJson + ', ' + linkJson + ')\'>🔗</button>' +
                            '<div class="upload-meta">' + dateStr + ' · ' + g.photos.length + ' Foto(s)' + (g.videos.length ? ' · ' + g.videos.length + ' Video(s)' : '') +
                                (g.socialLink ? ' · <a href="' + escapeHtml(g.socialLink) + '" target="_blank" rel="noopener" style="color:#667eea;">🔗 Link ansehen</a>' : '') +
                            '</div>' +
                        '</div>' +
                        '<span class="status-badge ' + statusInfo[1] + '">' + statusInfo[0] + '</span>' +
                    '</div>' +
                    '<div class="photo-grid">' + photosHtml + videosHtml + '</div>' +
                    '<div class="upload-actions">' +
                        (g.status !== 'approved' ? '<button class="btn-approve" onclick=\'approveGroup(' + groupIdsJson + ')\'>✅ Freigeben</button>' : '') +
                        (g.status !== 'rejected' ? '<button class="btn-reject" onclick=\'rejectGroup(' + groupIdsJson + ')\'>❌ Ablehnen</button>' : '') +
                        '<button class="btn-add-photo" onclick=\'addPhotosToGroup(' + JSON.stringify(g.id).replace(/'/g, '&#39;') + ', ' + titleJson + ', ' + JSON.stringify(g.status).replace(/'/g, '&#39;') + ')\'>➕ Foto hinzufügen</button>' +
                        '<button class="btn-add-photo" onclick=\'addVideosToGroup(' + JSON.stringify(g.id).replace(/'/g, '&#39;') + ', ' + titleJson + ', ' + JSON.stringify(g.status).replace(/'/g, '&#39;') + ')\'>🎥 Video hinzufügen</button>' +
                        '<button class="btn-delete" onclick=\'deleteGroup(' + groupIdsJson + ', ' + titleJson + ')\'>🗑️ Ganzen Beitrag löschen</button>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function updateGroupStatus(docIds, status) {
            var batch = db.batch();
            docIds.forEach(function(id) {
                batch.update(db.collection('eventPhotos').doc(id), { status: status });
            });
            return batch.commit();
        }

        function approveGroup(docIds) {
            updateGroupStatus(docIds, 'approved');
        }

        function rejectGroup(docIds) {
            updateGroupStatus(docIds, 'rejected');
        }

        // Falls das gerade gelöschte Foto das ausgewählte Startseiten-Bild war,
        // die Auswahl zurücksetzen, statt weiter ein totes Bild zu zeigen.
        function clearFeaturedIfMatches(imageDataList) {
            if (!currentFeaturedImageData || imageDataList.indexOf(currentFeaturedImageData) === -1) return;
            currentFeaturedImageData = null;
            db.collection('siteMeta').doc('gallery').set({
                featuredImageData: firebase.firestore.FieldValue.delete(),
                featuredTitle: firebase.firestore.FieldValue.delete()
            }, { merge: true }).catch(function(err) {
                console.error('❌ Konnte Startseiten-Bild-Auswahl nicht zurücksetzen:', err);
            });
        }

        function deleteGroup(docIds, title) {
            if (!confirm('„' + title + '" inkl. aller Fotos endgültig löschen?')) return;
            var deletedImages = allPhotoDocs.filter(function(d) { return docIds.indexOf(d.id) !== -1; }).map(function(d) { return d.imageData; });
            var batch = db.batch();
            docIds.forEach(function(id) {
                batch.delete(db.collection('eventPhotos').doc(id));
            });
            batch.commit().then(function() { clearFeaturedIfMatches(deletedImages); });
        }

        function deletePhoto(docId) {
            if (!confirm('Dieses eine Foto endgültig löschen?')) return;
            var photoDoc = allPhotoDocs.find(function(d) { return d.id === docId; });
            db.collection('eventPhotos').doc(docId).delete().then(function() {
                if (photoDoc) clearFeaturedIfMatches([photoDoc.imageData]);
            });
        }

        // Verkleinert & komprimiert ein Bild im Browser zu einem JPEG-Data-URL,
        // damit es sicher unter dem 1-MB-Limit pro Firestore-Dokument bleibt
        // (gleiche Technik wie auf der öffentlichen Upload-Seite).
        // maxDim/maxBytes bewusst moderat gehalten (nicht 1280px/500KB): jedes
        // Foto steckt als Base64 direkt im Firestore-Dokument und wird bei
        // jedem Laden komplett neu uebertragen - das kostenlose Firebase-
        // Kontingent hat ein hartes Tages-/Monatslimit fuer Datenuebertragung.
        function compressImageToDataUrl(file, maxDim, maxBytes) {
            maxDim = maxDim || 1000;
            maxBytes = maxBytes || 280 * 1024;
            return new Promise(function(resolve, reject) {
                var objectUrl = URL.createObjectURL(file);
                var img = new Image();

                var draw = function() {
                    // Manche Formate (v.a. HEIC von iPhones) liefern zwar ein "onload",
                    // aber der Browser konnte das Bild in Wahrheit nicht dekodieren -
                    // erkennbar an 0x0 "natürlichen" Maßen. Ohne diese Prüfung würde
                    // eine leere/transparente Fläche als komplett schwarzes JPEG
                    // exportiert, statt einen klaren Fehler zu zeigen.
                    if (!img.naturalWidth || !img.naturalHeight) {
                        URL.revokeObjectURL(objectUrl);
                        reject(new Error('Bildformat wird vom Browser nicht unterstützt (z.B. HEIC) - bitte als JPG/PNG speichern und erneut versuchen.'));
                        return;
                    }
                    var scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
                    var width = Math.round(img.naturalWidth * scale);
                    var height = Math.round(img.naturalHeight * scale);
                    var canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Absicherung gegen komplett schwarze Ergebnisse (z.B. wenn das
                    // Zeichnen aus irgendeinem Grund - Speicherlimit, Canvas-Bug -
                    // fehlschlägt): eine Stichprobe von Pixeln nehmen. Ein echtes Bild
                    // hat immer irgendeine Farbvarianz, ein leer gebliebenes Canvas ist
                    // durchgehend exakt (0,0,0).
                    try {
                        var sample = ctx.getImageData(0, 0, width, height).data;
                        var allBlack = true;
                        for (var p = 0; p < sample.length; p += 4 * 37) {
                            if (sample[p] !== 0 || sample[p + 1] !== 0 || sample[p + 2] !== 0) {
                                allBlack = false;
                                break;
                            }
                        }
                        if (allBlack) {
                            URL.revokeObjectURL(objectUrl);
                            reject(new Error('Bild konnte nicht korrekt verarbeitet werden (Ergebnis wäre komplett schwarz) - bitte erneut versuchen oder ein anderes Bild wählen.'));
                            return;
                        }
                    } catch (e) {
                        // getImageData kann in Ausnahmefällen selbst fehlschlagen - dann
                        // einfach normal weitermachen, ist nur eine Zusatzprüfung.
                    }

                    var quality = 0.8;
                    var dataUrl = canvas.toDataURL('image/jpeg', quality);
                    while (dataUrl.length * 0.75 > maxBytes && quality > 0.3) {
                        quality -= 0.1;
                        dataUrl = canvas.toDataURL('image/jpeg', quality);
                    }
                    URL.revokeObjectURL(objectUrl);
                    resolve(dataUrl);
                };

                img.onload = function() {
                    // img.decode() stellt sicher, dass das Bild WIRKLICH fertig
                    // dekodiert ist, bevor wir es aufs Canvas zeichnen (onload allein
                    // reicht in manchen Browsern nicht, das kann zu einem schwarzen
                    // Ergebnis führen).
                    if (img.decode) {
                        img.decode().then(draw).catch(function() {
                            URL.revokeObjectURL(objectUrl);
                            reject(new Error('Bild konnte nicht dekodiert werden - bitte ein anderes Format (JPG/PNG) versuchen.'));
                        });
                    } else {
                        draw();
                    }
                };
                img.onerror = function() {
                    URL.revokeObjectURL(objectUrl);
                    reject(new Error('Bild konnte nicht geladen werden - bitte ein anderes Format (JPG/PNG) versuchen.'));
                };
                img.src = objectUrl;
            });
        }

        // Admin fügt direkt hier im Freigabe-Tool ein oder mehrere Fotos zu einem
        // bestehenden Beitrag hinzu (z.B. wenn ein Foto beim Kunden-Upload nicht
        // ankam oder man selbst noch was ergänzen möchte).
        function addPhotosToGroup(groupId, title, groupStatus) {
            var input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*,.mpo,.mpf';
            input.multiple = true;
            input.onchange = function() {
                var files = Array.from(input.files || []);
                if (files.length === 0) return;

                Promise.all(files.map(function(file) {
                    return compressImageToDataUrl(file).then(function(imageData) {
                        return db.collection('eventPhotos').add({
                            uploadGroupId: groupId,
                            title: title,
                            imageData: imageData,
                            status: 'pending',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        }).then(function(docRef) {
                            // Erst als 'pending' anlegen (das verlangt die Regel beim Erstellen),
                            // danach auf den Status des restlichen Beitrags nachziehen.
                            if (groupStatus && groupStatus !== 'pending') {
                                return docRef.update({ status: groupStatus });
                            }
                        });
                    });
                })).catch(function(err) {
                    console.error('❌ Foto konnte nicht hinzugefügt werden:', err);
                    alert('❌ ' + (err && err.message ? err.message : 'Fehler beim Hinzufügen des Fotos.'));
                });
            };
            input.click();
        }

        // Cloudinary-Konto von Eisfavorite (gleiches unsigned Preset wie beim
        // öffentlichen Kunden-Upload) - Cloud Name/Preset sind keine Geheimnisse.
        var CLOUDINARY_CLOUD_NAME = 'tnzpe3nr';
        var CLOUDINARY_UPLOAD_PRESET = 'event_videos';

        function uploadVideoToCloudinary(file) {
            var formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            return fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD_NAME + '/video/upload', {
                method: 'POST',
                body: formData
            }).then(function(response) {
                if (!response.ok) throw new Error('Video-Upload fehlgeschlagen - bitte erneut versuchen.');
                return response.json();
            }).then(function(data) {
                return data.secure_url;
            });
        }

        // Admin fügt direkt hier im Freigabe-Tool ein oder mehrere Videos zu
        // einem bestehenden Beitrag hinzu (gleiche Idee wie addPhotosToGroup).
        function addVideosToGroup(groupId, title, groupStatus) {
            var input = document.createElement('input');
            input.type = 'file';
            input.accept = 'video/*';
            input.multiple = true;
            input.onchange = function() {
                var files = Array.from(input.files || []);
                if (files.length === 0) return;

                Promise.all(files.map(function(file) {
                    return uploadVideoToCloudinary(file).then(function(videoUrl) {
                        return db.collection('eventPhotos').add({
                            uploadGroupId: groupId,
                            title: title,
                            videoUrl: videoUrl,
                            status: 'pending',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        }).then(function(docRef) {
                            if (groupStatus && groupStatus !== 'pending') {
                                return docRef.update({ status: groupStatus });
                            }
                        });
                    });
                })).catch(function(err) {
                    console.error('❌ Video konnte nicht hinzugefügt werden:', err);
                    alert('❌ ' + (err && err.message ? err.message : 'Fehler beim Hinzufügen des Videos.'));
                });
            };
            input.click();
        }

        // Welches Foto aktuell als Startseiten-Bild ausgewählt ist (für den
        // markierten Stern) - einmal geladen, danach optimistisch lokal aktuell gehalten.
        var currentFeaturedImageData = null;
        db.collection('siteMeta').doc('gallery').get().then(function(snap) {
            var data = snap.data();
            currentFeaturedImageData = data && data.featuredImageData ? data.featuredImageData : null;
            render();
        }).catch(function(err) {
            console.error('❌ Konnte Startseiten-Bild-Auswahl nicht laden:', err);
        });

        function setFeaturedPhoto(docId) {
            var photoDoc = allPhotoDocs.find(function(d) { return d.id === docId; });
            if (!photoDoc) return;
            db.collection('siteMeta').doc('gallery').set({
                featuredImageData: photoDoc.imageData,
                featuredTitle: photoDoc.title,
                featuredSocialLink: photoDoc.socialLink ? photoDoc.socialLink : firebase.firestore.FieldValue.delete(),
                hasApproved: true,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).then(function() {
                currentFeaturedImageData = photoDoc.imageData;
                render();
            }).catch(function(err) {
                console.error('❌ Konnte Startseiten-Bild nicht setzen:', err);
                alert('❌ Fehler beim Festlegen des Startseiten-Bilds.');
            });
        }

        function editTitle(docIds, currentTitle) {
            var newTitle = prompt('Titel korrigieren:', currentTitle);
            if (newTitle === null) return;
            newTitle = newTitle.trim();
            if (!newTitle || newTitle === currentTitle) return;
            var batch = db.batch();
            docIds.forEach(function(id) {
                batch.update(db.collection('eventPhotos').doc(id), { title: newTitle });
            });
            batch.commit();
        }

        // Link zu einem Instagram-/Facebook-/YouTube-Post oder -Reel statt echtem
        // Video-Upload (der bräuchte Firebase Storage / den Blaze-Tarif).
        function editSocialLink(docIds, currentLink) {
            var newLink = prompt('Link zu Instagram/Facebook/YouTube (leer lassen zum Entfernen):', currentLink || '');
            if (newLink === null) return;
            newLink = newLink.trim();
            if (newLink && !/^https?:\/\//i.test(newLink)) {
                alert('❌ Bitte einen vollständigen Link mit https:// eingeben.');
                return;
            }
            var batch = db.batch();
            docIds.forEach(function(id) {
                batch.update(db.collection('eventPhotos').doc(id), {
                    socialLink: newLink ? newLink : firebase.firestore.FieldValue.delete()
                });
            });
            batch.commit();
        }

        // Pflegt ein winziges öffentliches Meta-Dokument (nur ein Boolean, keine
        // Bilddaten), damit die Website nicht bei jedem Seitenaufruf die
        // komplette eventPhotos-Collection samt Bilddaten laden muss, nur um zu
        // wissen, ob überhaupt freigegebene Fotos existieren.
        var lastKnownHasApproved = null;
        function updateGalleryMetaIfChanged() {
            var hasApproved = allPhotoDocs.some(function(d) { return d.status === 'approved'; });
            if (hasApproved === lastKnownHasApproved) return;
            lastKnownHasApproved = hasApproved;
            db.collection('siteMeta').doc('gallery').set({
                hasApproved: hasApproved,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).catch(function(err) {
                console.error('❌ Galerie-Meta-Update fehlgeschlagen:', err);
            });
        }

        db.collection('eventPhotos').orderBy('createdAt', 'desc').onSnapshot(function(snapshot) {
            allPhotoDocs = snapshot.docs.map(function(d) {
                return Object.assign({ id: d.id }, d.data());
            });
            updateGalleryMetaIfChanged();
            render();
        }, function(error) {
            console.error('❌ Konnte Uploads nicht laden:', error);
            document.getElementById('uploadsList').innerHTML = '<div class="empty-msg">Fehler beim Laden: ' + error.message + '</div>';
        });
    </script>
</body>
</html>
