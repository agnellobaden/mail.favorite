<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event-Bilder freigeben - EisFavorite</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
    }
    .container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        padding: 25px;
    }
    .back-link {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
        display: inline-block;
        margin-bottom: 15px;
    }
    h1 { color: #667eea; margin-bottom: 20px; font-size: 1.5em; }
    .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }
    .tab {
        padding: 8px 16px;
        border-radius: 20px;
        border: 2px solid #667eea;
        background: white;
        color: #667eea;
        font-weight: 600;
        font-size: 0.9em;
        cursor: pointer;
    }
    .tab.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }
    .upload-card {
        border: 1px solid #eee;
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 18px;
    }
    .upload-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
    }
    .upload-title { font-size: 1.15em; font-weight: 700; color: #333; }
    .upload-meta { font-size: 0.85em; color: #888; }
    .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 0.8em;
        font-weight: 700;
    }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-approved { background: #d4edda; color: #155724; }
    .status-rejected { background: #f8d7da; color: #721c24; }
    .photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 8px;
        margin-bottom: 14px;
    }
    .photo-grid img {
        width: 100%;
        height: 100px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #ddd;
    }
    .upload-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }
    .upload-actions button {
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.9em;
        cursor: pointer;
    }
    .btn-approve { background: #28a745; color: white; }
    .btn-reject { background: #ffc107; color: #333; }
    .btn-delete { background: #dc3545; color: white; }
    .empty-msg { text-align: center; color: #888; padding: 40px 0; }
</style>
</head>
<body>
    <div id="__authGate" style="position:fixed;inset:0;background:#fff;z-index:999999;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;color:#667eea;font-weight:700;font-size:1.1em;">🔒 Prüfe Anmeldung...</div>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
        (function() {
            var __cfg = {
                apiKey: "AIzaSyDNtaUvAbjU2OHjLWNnNJyhkccoH9YlkYo",
                authDomain: "mailfavorite-e8f49.firebaseapp.com",
                projectId: "mailfavorite-e8f49",
                storageBucket: "mailfavorite-e8f49.firebasestorage.app",
                messagingSenderId: "73719715044",
                appId: "1:73719715044:web:e0e762cda49ae166b6c8f1",
                measurementId: "G-WGRT5L3NCX"
            };
            var __isLocal = location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
            if (__isLocal) {
                var __gate = document.getElementById('__authGate');
                if (__gate) __gate.remove();
                return;
            }

            if (!firebase.apps.length) firebase.initializeApp(__cfg);
            var __allowedEmails = ['eisfavorit@gmail.com', 'agnello.baden@gmail.com'];

    <div class="container">
        <a href="buchungen-uebersicht.html" class="back-link">← Zurück zur Übersicht</a>
        <h1>🖼️ Event-Bilder freigeben</h1>

        <div class="tabs">
            <button class="tab active" data-filter="pending" onclick="setFilter('pending')">⏳ Ausstehend</button>
            <button class="tab" data-filter="approved" onclick="setFilter('approved')">✅ Freigegeben</button>
            <button class="tab" data-filter="rejected" onclick="setFilter('rejected')">❌ Abgelehnt</button>
            <button class="tab" data-filter="all" onclick="setFilter('all')">📋 Alle</button>
        </div>

        <div id="uploadsList"></div>
    </div>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyDNtaUvAbjU2OHjLWNnNJyhkccoH9YlkYo",
            authDomain: "mailfavorite-e8f49.firebaseapp.com",
            projectId: "mailfavorite-e8f49",
            storageBucket: "mailfavorite-e8f49.firebasestorage.app",
            messagingSenderId: "73719715044",
            appId: "1:73719715044:web:e0e762cda49ae166b6c8f1",
            measurementId: "G-WGRT5L3NCX"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();

        var allPhotoDocs = [];
        var currentFilter = 'pending';

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.tab').forEach(function(t) {
                t.classList.toggle('active', t.dataset.filter === filter);
            });
            render();
        }

        var STATUS_LABELS = {
            pending: ['⏳ Ausstehend', 'status-pending'],
            approved: ['✅ Freigegeben', 'status-approved'],
            rejected: ['❌ Abgelehnt', 'status-rejected']
        };

        // Jedes Firestore-Dokument ist genau 1 Foto (Firestore-1MB-Limit) -
        // für die Anzeige nach uploadGroupId zu Alben zusammenfassen.
        function groupUploads() {
            var groups = {};
            allPhotoDocs.forEach(function(doc) {
                var key = doc.uploadGroupId || doc.id;
                if (!groups[key]) {
                    groups[key] = { id: key, title: doc.title, status: doc.status, createdAt: doc.createdAt, docIds: [], photos: [] };
                }
                groups[key].docIds.push(doc.id);
                groups[key].photos.push(doc.imageData);
                // Status: 'pending' überstimmt (falls einzelne Fotos noch nicht entschieden sind)
                if (doc.status === 'pending') groups[key].status = 'pending';
            });
            return Object.values(groups).sort(function(a, b) {
                var ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
                var tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
                return tb - ta;
            });
        }

        function render() {
            var list = document.getElementById('uploadsList');
            var groups = groupUploads().filter(function(g) {
                return currentFilter === 'all' || g.status === currentFilter;
            });

            if (groups.length === 0) {
                list.innerHTML = '<div class="empty-msg">Keine Einträge in dieser Ansicht.</div>';
                return;
            }

            list.innerHTML = groups.map(function(g) {
                var statusInfo = STATUS_LABELS[g.status] || ['?', ''];
                var dateStr = g.createdAt && g.createdAt.toDate ? g.createdAt.toDate().toLocaleString('de-DE') : '';
                var photosHtml = g.photos.map(function(imageData) {
                    return '<img src="' + imageData + '" alt="">';
                }).join('');
                var groupIdsJson = JSON.stringify(g.docIds).replace(/'/g, '&#39;');

                return '<div class="upload-card">' +
                    '<div class="upload-card-header">' +
                        '<div>' +
                            '<div class="upload-title">' + escapeHtml(g.title) + '</div>' +
                            '<div class="upload-meta">' + dateStr + ' · ' + g.photos.length + ' Foto(s)</div>' +
                        '</div>' +
                        '<span class="status-badge ' + statusInfo[1] + '">' + statusInfo[0] + '</span>' +
                    '</div>' +
                    '<div class="photo-grid">' + photosHtml + '</div>' +
                    '<div class="upload-actions">' +
                        (g.status !== 'approved' ? '<button class="btn-approve" onclick=\'approveGroup(' + groupIdsJson + ')\'>✅ Freigeben</button>' : '') +
                        (g.status !== 'rejected' ? '<button class="btn-reject" onclick=\'rejectGroup(' + groupIdsJson + ')\'>❌ Ablehnen</button>' : '') +
                        '<button class="btn-delete" onclick=\'deleteGroup(' + groupIdsJson + ', ' + JSON.stringify(g.title).replace(/'/g, '&#39;') + ')\'>🗑️ Löschen</button>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function updateGroupStatus(docIds, status) {
            var batch = db.batch();
            docIds.forEach(function(id) {
                batch.update(db.collection('eventPhotos').doc(id), { status: status });
            });
            return batch.commit();
        }

        function approveGroup(docIds) {
            updateGroupStatus(docIds, 'approved');
        }

        function rejectGroup(docIds) {
            updateGroupStatus(docIds, 'rejected');
        }

        function deleteGroup(docIds, title) {
            if (!confirm('„' + title + '" inkl. aller Fotos endgültig löschen?')) return;
            var batch = db.batch();
            docIds.forEach(function(id) {
                batch.delete(db.collection('eventPhotos').doc(id));
            });
            batch.commit();
        }

        db.collection('eventPhotos').orderBy('createdAt', 'desc').onSnapshot(function(snapshot) {
            allPhotoDocs = snapshot.docs.map(function(d) {
                return Object.assign({ id: d.id }, d.data());
            });
            render();
        }, function(error) {
            console.error('❌ Konnte Uploads nicht laden:', error);
            document.getElementById('uploadsList').innerHTML = '<div class="empty-msg">Fehler beim Laden: ' + error.message + '</div>';
        });
    </script>
</body>
</html>
