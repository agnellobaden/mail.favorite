<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Strichliste - Freier Verkauf - EisFavorite</title>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 15px;
    }
    .container {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        padding-bottom: 100px;
    }
    .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
    }
    .header-top-row { display: flex; justify-content: space-between; align-items: center; }
    .back-link {
        color: white;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9em;
        opacity: 0.9;
    }
    .close-btn {
        width: auto;
        height: 36px;
        border-radius: 18px;
        border: none;
        background: rgba(255,255,255,0.2);
        color: white;
        font-size: 0.85em;
        font-weight: 700;
        cursor: pointer;
        padding: 0 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
    }
    .close-btn:hover { background: rgba(255,255,255,0.35); }
    .header h1 { font-size: 1.4em; margin: 10px 0 4px 0; }
    .header .subtitle { font-size: 0.9em; opacity: 0.9; }

    .summary {
        background: #f8f9fa;
        margin: 15px;
        border-radius: 12px;
        padding: 18px;
        text-align: center;
        border: 2px solid #e0e0e0;
    }
    .summary .total-label { font-size: 0.85em; color: #666; font-weight: 600; text-transform: uppercase; }
    .summary .total-value { font-size: 2.2em; font-weight: 800; color: #667eea; }

    .products {
        padding: 0 15px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
    }
    .product-card {
        background: white;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        cursor: pointer;
        user-select: none;
        transition: transform 0.1s, box-shadow 0.1s;
    }
    .product-card:active {
        transform: scale(0.97);
        box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }
    .product-card .top-row { display: flex; justify-content: space-between; align-items: center; }
    .product-card .emoji { font-size: 1.8em; }
    .product-card .price { font-size: 0.8em; color: #666; font-weight: 600; }
    .product-card .name { font-weight: 700; font-size: 0.9em; color: #333; text-align: center; min-height: 34px; display: flex; align-items: center; justify-content: center; }
    .counter-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: #f8f9fa;
        padding: 8px;
        border-radius: 8px;
    }
    .counter-btn {
        width: 42px;
        height: 42px;
        border: none;
        border-radius: 50%;
        font-size: 1.4em;
        font-weight: bold;
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.1s;
    }
    .counter-btn:active { transform: scale(0.9); }
    .counter-btn.minus { background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%); }
    .counter-btn.plus { background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); }
    .counter-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .count-display { flex: 1; text-align: center; font-size: 1.6em; font-weight: 800; color: #667eea; }
    .product-total { text-align: center; font-size: 0.95em; font-weight: 700; color: #667eea; padding-top: 6px; border-top: 2px solid #f0f0f0; }

    .bottom-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: white;
        box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
        padding: 15px;
        display: flex;
        gap: 10px;
        justify-content: center;
        z-index: 100;
    }
    .btn {
        flex: 1;
        max-width: 220px;
        padding: 15px;
        border: none;
        border-radius: 10px;
        font-size: 1em;
        font-weight: 700;
        cursor: pointer;
    }
    .btn-reset { background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%); color: white; }
    .btn-prices { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }

    #priceModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:2000; overflow-y:auto; }
    #priceModal .box { max-width:420px; margin:40px auto; background:white; border-radius:16px; padding:25px; box-shadow:0 10px 40px rgba(0,0,0,0.3); }
    #priceModal label { display:block; font-weight:600; font-size:0.9em; color:#333; margin-bottom:4px; }
    #priceModal input { width:100%; padding:10px; border:2px solid #ddd; border-radius:8px; font-size:1em; margin-bottom:12px; }
</style>
</head>
<body>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <div class="container">
        <div class="header">
            <div class="header-top-row">
                <a href="buchungen-uebersicht.html" class="back-link">← Zurück zur Übersicht</a>
                <a href="buchungen-uebersicht.html" class="close-btn" title="Schließen">✕</a>
            </div>
            <h1>🧮 Freier Verkauf</h1>
            <div class="subtitle">Strichliste ohne Buchung - wie ein Taschenrechner</div>
        </div>

        <div class="summary">
            <div class="total-label">Gesamtbetrag</div>
            <div class="total-value" id="totalValue">0.00 €</div>
        </div>

        <div class="products" id="productsGrid"></div>
    </div>

    <div class="bottom-bar">
        <button class="btn btn-prices" onclick="openPriceModal()">💰 Preise</button>
        <button class="btn btn-reset" onclick="resetTally()">🔄 Neuer Verkauf</button>
    </div>

    <div id="priceModal">
        <div class="box">
            <h2 style="color:#667eea; margin-bottom:18px;">💰 Preise verwalten</h2>
            <div id="priceInputsContainer"></div>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn" style="background:#f0f0f0; color:#333;" onclick="closePriceModal()">Abbrechen</button>
                <button class="btn btn-prices" onclick="savePricesFromModal()">💾 Speichern</button>
            </div>
        </div>
    </div>

    <script>
        const PRODUCTS_LIST = [
            { id: 'kugel', name: 'Kugel Eis', emoji: '🍨' },
            { id: 'spaghetti', name: 'Spaghetti Eis', emoji: '🍝' },
            { id: 'schokobecher', name: 'Schoko Becher', emoji: '🍫' },
            { id: 'sahne', name: 'Sahne', emoji: '🥛' },
            { id: 'eiskaffee', name: 'Eiskaffee', emoji: '☕' },
            { id: 'milchshake', name: 'Milchshake', emoji: '🥤' },
            { id: 'streussel', name: 'Streussel', emoji: '🎨' },
            { id: 'toppings', name: 'Toppings', emoji: '🍓' }
        ];

        const DEFAULT_PRICES = {
            kugel: 1.80, spaghetti: 7.50, schokobecher: 7.50, sahne: 1.80,
            eiskaffee: 7.50, milchshake: 6.00, streussel: 0.50, toppings: 1.00
        };

        const STORAGE_KEY = 'eisfavorite_freieStrichliste';

        function loadPrices() {
            try {
                const saved = localStorage.getItem('productPrices');
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            return { ...DEFAULT_PRICES };
        }

        function savePrices(prices) {
            localStorage.setItem('productPrices', JSON.stringify(prices));
        }

        let counts = {};

        function loadCounts() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            const initial = {};
            PRODUCTS_LIST.forEach(p => initial[p.id] = 0);
            return initial;
        }

        function saveCounts() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(counts));
        }

        function render() {
            const prices = loadPrices();
            const grid = document.getElementById('productsGrid');
            let total = 0;

            grid.innerHTML = PRODUCTS_LIST.map(product => {
                const count = counts[product.id] || 0;
                const price = prices[product.id] || 0;
                const lineTotal = count * price;
                total += lineTotal;

                return `
                    <div class="product-card" onclick="cardClicked(event, '${product.id}')">
                        <div class="top-row">
                            <span class="emoji">${product.emoji}</span>
                            <span class="price">${price.toFixed(2)} €</span>
                        </div>
                        <div class="name">${product.name}</div>
                        <div class="counter-row">
                            <button class="counter-btn minus" onclick="changeCount('${product.id}', -1)" ${count === 0 ? 'disabled' : ''}>−</button>
                            <div class="count-display">${count}</div>
                            <button class="counter-btn plus" onclick="changeCount('${product.id}', 1)">+</button>
                        </div>
                        <div class="product-total">${lineTotal.toFixed(2)} €</div>
                    </div>
                `;
            }).join('');

            document.getElementById('totalValue').textContent = total.toFixed(2) + ' €';
        }

        function changeCount(productId, delta) {
            counts[productId] = Math.max(0, (counts[productId] || 0) + delta);
            if (delta > 0) playAddSound();
            saveCounts();
            render();
        }

        // Klick auf die Karte selbst zählt +1 - Klicks auf die -/+ Buttons
        // selbst werden hier ignoriert, die haben ihren eigenen onclick.
        function cardClicked(event, productId) {
            if (event.target.closest('button')) return;
            changeCount(productId, 1);
        }

        let audioCtx = null;
        function playAddSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.warn('Sound konnte nicht abgespielt werden:', e);
            }
        }

        function getDb() {
            if (!firebase.apps.length) {
                firebase.initializeApp({
                    apiKey: "AIzaSyDNtaUvAbjU2OHjLWNnNJyhkccoH9YlkYo",
                    authDomain: "mailfavorite-e8f49.firebaseapp.com",
                    projectId: "mailfavorite-e8f49",
                    storageBucket: "mailfavorite-e8f49.firebasestorage.app",
                    messagingSenderId: "73719715044",
                    appId: "1:73719715044:web:e0e762cda49ae166b6c8f1",
                    measurementId: "G-WGRT5L3NCX"
                });
            }
            return firebase.firestore();
        }

        function currentTotal() {
            const prices = loadPrices();
            let total = 0;
            PRODUCTS_LIST.forEach(p => { total += (counts[p.id] || 0) * (prices[p.id] || 0); });
            return total;
        }

        // Bevor der Verkauf zurückgesetzt wird: Ergebnis optional direkt als
        // Tageseinnahme speichern (siehe tageseinnahmen.html), damit der Tag
        // nicht nur "verrechnet", sondern auch dauerhaft protokolliert wird.
        function resetTally() {
            const total = currentTotal();

            if (total > 0 && confirm(`Aktuellen Verkauf (${total.toFixed(2)} €) als Tageseinnahme von heute speichern, bevor zurückgesetzt wird?`)) {
                const now = new Date();
                const dateIso = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
                const dateDe = String(now.getDate()).padStart(2, '0') + '.' + String(now.getMonth() + 1).padStart(2, '0') + '.' + now.getFullYear();
                getDb().collection('tageseinnahmen').add({
                    dateIso: dateIso,
                    date: dateDe,
                    amount: total,
                    note: 'Freier Verkauf',
                    createdAtMs: Date.now()
                }).catch(err => {
                    alert('⚠️ Konnte nicht als Tageseinnahme gespeichert werden: ' + err.message);
                });
            }

            if (!confirm('Neuen Verkauf starten? Der aktuelle Verkauf wird zurückgesetzt.')) return;
            PRODUCTS_LIST.forEach(p => counts[p.id] = 0);
            saveCounts();
            render();
        }

        function openPriceModal() {
            const prices = loadPrices();
            document.getElementById('priceInputsContainer').innerHTML = PRODUCTS_LIST.map(p => `
                <div>
                    <label>${p.emoji} ${p.name} (€)</label>
                    <input type="number" step="0.01" min="0" id="priceInput_${p.id}" value="${(prices[p.id] ?? DEFAULT_PRICES[p.id]).toFixed(2)}">
                </div>
            `).join('');
            document.getElementById('priceModal').style.display = 'block';
        }

        function closePriceModal() {
            document.getElementById('priceModal').style.display = 'none';
        }

        function savePricesFromModal() {
            const prices = {};
            PRODUCTS_LIST.forEach(p => {
                const val = parseFloat(document.getElementById(`priceInput_${p.id}`).value);
                prices[p.id] = isNaN(val) ? DEFAULT_PRICES[p.id] : val;
            });
            savePrices(prices);
            closePriceModal();
            render();
        }

        counts = loadCounts();
        render();
    </script>
</body>
</html>
