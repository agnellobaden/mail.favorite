        const DEFAULT_PRICES = {
            kugel: 1.80, spaghetti: 7.50, schokobecher: 7.50, sahne: 1.80,
            eiskaffee: 7.50, milchshake: 6.00, streussel: 0.50, toppings: 1.00
        };

        function loadPrices() {
            try {
                const saved = localStorage.getItem('productPrices');
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            return { ...DEFAULT_PRICES };
        }

        function calculateTravelCost(distance) {
            const km = parseFloat(distance) || 0;
            if (km < 6) return 0;
            if (km < 10) return 45;
            const additionalKm = km - 10;
            const additionalCost = Math.floor(additionalKm / 10) * 10;
            return 55 + additionalCost;
        }

        let currentBooking = null;
        const db = firebase.firestore();

        // Trägt ein Ereignis (Angebot erstellt/versendet) als Systemmeldung in
        // den Chat-Verlauf der Buchung ein - erscheint dort zusammen mit
        // Rechnungen und normalen Nachrichten in einem gemeinsamen,
        // chronologischen Verlauf (buchungen-uebersicht.html -> "💬 Chat-Verlauf").
        function logToBookingHistory(message) {
            if (!currentBooking) return;
            const entry = { message, direction: 'sent', type: 'system', timestamp: new Date().toISOString() };

            const bookings = JSON.parse(localStorage.getItem('eisfavorite_bookings') || '[]');
            const bookingIndex = bookings.findIndex(b => b.id === currentBooking.id);
            if (bookingIndex !== -1) {
                if (!bookings[bookingIndex].emailHistory) bookings[bookingIndex].emailHistory = [];
                bookings[bookingIndex].emailHistory.push(entry);
                bookings[bookingIndex].lastModified = new Date().toISOString();
                bookings[bookingIndex].lastModifiedMs = Date.now();
                localStorage.setItem('eisfavorite_bookings', JSON.stringify(bookings));
            }

            if (db) {
                db.collection('buchungen').doc(currentBooking.id).set({
                    emailHistory: firebase.firestore.FieldValue.arrayUnion(entry),
                    lastModified: new Date().toISOString(),
                    lastModifiedMs: Date.now()
                }, { merge: true }).catch(err => {
                    console.error('❌ Konnte Ereignis nicht in Firestore protokollieren:', err);
                });
            }
        }

        // Setzt das angebotSent-Flag, damit buchungen-uebersicht.html einen
        // Badge auf der Karte anzeigen kann (analog zum ✅-Häkchen bei
        // versendeten Rechnungen). Separat von logToBookingHistory(), weil
        // dort nur der Chat-Verlauf aktualisiert wird, kein eigenes Feld.
        function markAngebotSent() {
            if (!currentBooking) return;
            const nowIso = new Date().toISOString();

            const bookings = JSON.parse(localStorage.getItem('eisfavorite_bookings') || '[]');
            const bookingIndex = bookings.findIndex(b => b.id === currentBooking.id);
            if (bookingIndex !== -1) {
                bookings[bookingIndex].angebotSent = true;
                bookings[bookingIndex].angebotSentDate = nowIso;
                bookings[bookingIndex].lastModified = nowIso;
                bookings[bookingIndex].lastModifiedMs = Date.now();
                localStorage.setItem('eisfavorite_bookings', JSON.stringify(bookings));
            }

            if (db) {
                db.collection('buchungen').doc(currentBooking.id).set({
                    angebotSent: true,
                    angebotSentDate: nowIso,
                    lastModified: nowIso,
                    lastModifiedMs: Date.now()
                }, { merge: true }).catch(err => {
                    console.error('❌ Konnte angebotSent nicht in Firestore speichern:', err);
                });
            }
        }

                    </div>

                    <table class="invoice-table">

        function downloadOfferPDF() {
            const element = document.getElementById('offerContent');
            const customerName = currentBooking.company || currentBooking.name || 'Kunde';

            html2pdf().set({
                margin: 10,
                filename: `Angebot_EisFavorite_${customerName.replace(/\s/g, '_')}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(element).save();

            logToBookingHistory('📋 Angebot erstellt (PDF heruntergeladen)');
        }

        function sendOfferByEmail() {
            if (!currentBooking.email) {
                alert('❌ Keine E-Mail-Adresse für diese Buchung hinterlegt!');
                return;
            }

            const customerName = currentBooking.company || currentBooking.name || 'Kunde';
            const email = currentBooking.email;
            const element = document.getElementById('offerContent');

            html2pdf().set({
                margin: 10,
                filename: `Angebot_EisFavorite_${customerName.replace(/\s/g, '_')}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(element).output('blob').then(function(blob) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `Angebot_EisFavorite_${customerName.replace(/\s/g, '_')}.pdf`;
                link.click();

                setTimeout(() => {
                    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                    const subject = encodeURIComponent('Angebot für Ihre Veranstaltung - EisFavorite');
                    const body = encodeURIComponent(
                        `Hallo ${currentBooking.name || ''},\n\n` +
                        `vielen Dank für Ihre Anfrage!\n\n` +
                        `Im Anhang finden Sie unser Angebot für Ihre Veranstaltung.\n\n` +
                        `Bei Fragen stehen wir Ihnen gerne zur Verfügung.\n\n` +
                        `Mit freundlichen Grüßen\nIhr EisFavorite Team`
                    );

                    if (isMobile) {
                        window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
                    } else {
                        window.open(`https://mail.google.com/mail/?view=cm&fs=1&authuser=eisfavorit@gmail.com&to=${encodeURIComponent(email)}&su=${subject}&body=${body}`, '_blank');
                    }

                    alert('✓ PDF wurde heruntergeladen!\n\n📧 E-Mail-Programm wird geöffnet...\n\nBitte hänge das heruntergeladene PDF manuell an die E-Mail an.');
                    logToBookingHistory(`📋 Angebot per E-Mail an ${email} versendet`);
                    markAngebotSent();
                }, 500);
            });
        }

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const bookingId = urlParams.get('bookingId');

            if (!bookingId) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                document.getElementById('errorState').textContent = '❌ Keine Buchung angegeben. Bitte über das Kartenmenü öffnen.';
                return;
            }

            let bookings = [];
            try {
                bookings = JSON.parse(localStorage.getItem('eisfavorite_bookings') || '[]');
            } catch (e) {}

            const booking = bookings.find(b => b.id === bookingId);

            if (!booking) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                document.getElementById('errorState').textContent = '❌ Buchung nicht gefunden (ID: ' + bookingId + ')';
                return;
            }

            currentBooking = booking;
            document.getElementById('offerContent').innerHTML = generateOfferHTML(booking);
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('actionButtons').style.display = 'flex';
        }

        init();
    </script>
</body>
</html>
