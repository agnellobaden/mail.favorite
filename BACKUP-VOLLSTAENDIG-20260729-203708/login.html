<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anmelden - EisFavorite</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#667eea">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .box {
        max-width: 380px;
        width: 100%;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        padding: 30px;
    }
    .box h1 { text-align: center; color: #667eea; font-size: 1.5em; margin-bottom: 5px; }
    .box .subtitle { text-align: center; color: #888; font-size: 0.9em; margin-bottom: 25px; }
    label { display: block; font-weight: 600; font-size: 0.9em; color: #333; margin-bottom: 6px; }
    input {
        width: 100%;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 1em;
        margin-bottom: 16px;
    }
    input:focus { outline: none; border-color: #667eea; }
    .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-size: 1em;
        font-weight: 700;
        cursor: pointer;
        margin-bottom: 10px;
    }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .btn-secondary { background: #f0f0f0; color: #333; }
    .error-msg { color: #e74c3c; font-size: 0.9em; text-align: center; margin-bottom: 12px; min-height: 1.2em; }
    .toggle-link { text-align: center; font-size: 0.85em; color: #667eea; cursor: pointer; text-decoration: underline; }
    .btn-google {
        background: white;
        color: #444;
        border: 2px solid #ddd;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    .btn-google:hover { background: #f8f9fa; }
    .divider {
        display: flex;
        align-items: center;
        text-align: center;
        color: #999;
        font-size: 0.85em;
        margin: 18px 0;
    }
    .divider::before, .divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #ddd;
    }
    .divider:not(:empty)::before { margin-right: 10px; }
    .divider:not(:empty)::after { margin-left: 10px; }
</style>
</head>
<body>
    <div class="box">
        <h1>🍦 EisFavorite</h1>
        <p class="subtitle" id="modeLabel">Anmelden</p>

        <div class="error-msg" id="errorMsg"></div>

        <button type="button" class="btn btn-google" onclick="loginWithGoogle()">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.08-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.95 10.7c-.18-.54-.28-1.11-.28-1.7s.1-1.16.28-1.7V4.97H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
            Mit Google anmelden
        </button>

        <div class="divider">oder</div>

        <form id="authForm">
            <label for="email">E-Mail</label>
            <input type="email" id="email" required autocomplete="username">

            <label for="password">Passwort</label>
            <input type="password" id="password" required autocomplete="current-password" minlength="6">

            <button type="submit" class="btn btn-primary" id="submitBtn">Anmelden</button>
        </form>

        <div class="toggle-link" id="toggleLink" onclick="toggleMode()">Noch kein Konto? Einmalig einrichten</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDNtaUvAbjU2OHjLWNnNJyhkccoH9YlkYo",
            authDomain: "mailfavorite-e8f49.firebaseapp.com",
            projectId: "mailfavorite-e8f49",
            storageBucket: "mailfavorite-e8f49.firebasestorage.app",
            messagingSenderId: "73719715044",
            appId: "1:73719715044:web:e0e762cda49ae166b6c8f1",
            measurementId: "G-WGRT5L3NCX"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        let isSignupMode = false;

        function toggleMode() {
            isSignupMode = !isSignupMode;
            document.getElementById('modeLabel').textContent = isSignupMode ? 'Konto einrichten (nur einmal nötig)' : 'Anmelden';
            document.getElementById('submitBtn').textContent = isSignupMode ? 'Konto erstellen' : 'Anmelden';
            document.getElementById('toggleLink').textContent = isSignupMode ? 'Habe schon ein Konto - Anmelden' : 'Noch kein Konto? Einmalig einrichten';
            document.getElementById('errorMsg').textContent = '';
        }

        const ALLOWED_EMAILS = ['eisfavorit@gmail.com', 'agnello.baden@gmail.com', 'schaefermonika35@gmail.com'];

        // Wenn bereits angemeldet, direkt weiterleiten (nur erlaubte E-Mails)
        firebase.auth().onAuthStateChanged(function(user) {
            if (!user) return;

            if (ALLOWED_EMAILS.indexOf(user.email) === -1) {
                firebase.auth().signOut().then(function() {
                    document.getElementById('errorMsg').textContent = '❌ Zugriff verweigert: ' + user.email + ' ist nicht berechtigt.';
                });
                return;
            }

            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect') || 'buchungen-uebersicht.html';
            window.location.href = redirect;
        });

        function loginWithGoogle() {
            const errorEl = document.getElementById('errorMsg');
            errorEl.textContent = '';
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider).catch(function(error) {
                console.error(error);
                if (error.code === 'auth/popup-blocked' || error.code === 'auth/cancelled-popup-request') {
                    // Fallback für Browser, die Popups blockieren (z.B. manche mobile Browser)
                    firebase.auth().signInWithRedirect(provider);
                } else if (error.code !== 'auth/popup-closed-by-user') {
                    errorEl.textContent = '❌ Google-Login fehlgeschlagen: ' + error.message;
                }
            });
        }

        // Ergebnis von signInWithRedirect abfangen (Fallback-Pfad)
        firebase.auth().getRedirectResult().catch(function(error) {
            console.error('Redirect-Login-Fehler:', error);
        });

        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMsg');
            errorEl.textContent = '';

            const action = isSignupMode
                ? firebase.auth().createUserWithEmailAndPassword(email, password)
                : firebase.auth().signInWithEmailAndPassword(email, password);

            action.catch(function(error) {
                console.error(error);
                let msg = 'Fehler: ' + error.message;
                if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    msg = '❌ Falsches Passwort oder E-Mail.';
                } else if (error.code === 'auth/user-not-found') {
                    msg = '❌ Kein Konto mit dieser E-Mail gefunden. Erst einrichten (Link unten).';
                } else if (error.code === 'auth/email-already-in-use') {
                    msg = '❌ Konto existiert schon - bitte stattdessen anmelden.';
                } else if (error.code === 'auth/weak-password') {
                    msg = '❌ Passwort zu kurz (mind. 6 Zeichen).';
                }
                errorEl.textContent = msg;
            });
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').catch(function(err) {
                    console.error('Service Worker Registrierung fehlgeschlagen:', err);
                });
            });
        }
    </script>
</body>
</html>
